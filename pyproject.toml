[project]
name = "wdp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "artem", email = "artemkhen5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wdp = "wdp:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
